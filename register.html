<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب جديد - برق رشق</title><style>body{margin:0;background:#000;color:#fff;font-family:tahoma;display:flex;align-items:center;justify-content:center;height:100vh} .box{background:#111;padding:30px;border-radius:15px;width:90%;max-width:350px;border:1px solid #333;text-align:center} input{width:90%;padding:12px;margin:10px 0;border-radius:8px;border:0} .btn{background:#ffea00;color:#000;padding:12px;width:95%;border-radius:8px;border:0;font-weight:bold;margin-top:10px}</style></head><body><div class="box"><h2 style="color:#ffea00">إنشاء حساب</h2><input id="u" placeholder="اسم المستخدم الجديد"><input id="p" type="password" placeholder="كلمة المرور"><button class="btn" onclick="if(u.value&&p.value){localStorage.setItem('user',u.value);alert('تم إنشاء الحساب!');location.href='index.html'}else alert('عبي البيانات')">تسجيل</button><p><a href="login.html" style="color:#ffea00">عندك حساب؟ دخول</a></p></div></body></html>
